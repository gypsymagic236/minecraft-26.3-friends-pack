<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="310" viewBox="0 0 1176 310" role="img" aria-labelledby="title desc">
  <title id="title">Connect to the Minecraft server with Tailscale</title>
  <desc id="desc">Three illustrated steps: install Tailscale and sign in, accept Darren's private invitation, then add the private server address with port 25565 in Minecraft Java Edition.</desc>
  <rect width="1176" height="310" rx="20" fill="#101720"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(16 16)">
      <rect width="368" height="278" rx="16" fill="#192532" stroke="#344657"/>
      <circle cx="31" cy="31" r="16" fill="#e86c65"/>
      <text x="31" y="37" text-anchor="middle" font-size="17" font-weight="700" fill="#101720">1</text>
      <text x="57" y="38" font-size="20" font-weight="700" fill="#f3f6fa">Install Tailscale</text>
      <rect x="20" y="65" width="328" height="161" rx="12" fill="#f9fbfd"/>
      <rect x="20" y="65" width="328" height="29" rx="12" fill="#e8edf2"/>
      <rect x="20" y="83" width="328" height="11" fill="#e8edf2"/>
      <circle cx="36" cy="79" r="4" fill="#e76b67"/>
      <circle cx="50" cy="79" r="4" fill="#e2b85c"/>
      <circle cx="64" cy="79" r="4" fill="#79bd8a"/>
      <text x="38" y="124" font-size="14" font-weight="700" fill="#243545">Tailscale</text>
      <text x="38" y="153" font-size="13" fill="#435568">Install the app on your computer</text>
      <rect x="38" y="169" width="131" height="34" rx="8" fill="#d86a63"/>
      <text x="103" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Sign in</text>
      <text x="20" y="258" font-size="14" fill="#c8d6e3">Use your own Tailscale account</text>
    </g>
    <g transform="translate(404 16)">
      <rect width="368" height="278" rx="16" fill="#192532" stroke="#344657"/>
      <circle cx="31" cy="31" r="16" fill="#e86c65"/>
      <text x="31" y="37" text-anchor="middle" font-size="17" font-weight="700" fill="#101720">2</text>
      <text x="57" y="38" font-size="20" font-weight="700" fill="#f3f6fa">Accept the invite</text>
      <rect x="20" y="65" width="328" height="161" rx="12" fill="#f9fbfd"/>
      <rect x="20" y="65" width="328" height="29" rx="12" fill="#e8edf2"/>
      <rect x="20" y="83" width="328" height="11" fill="#e8edf2"/>
      <circle cx="36" cy="79" r="4" fill="#e76b67"/>
      <circle cx="50" cy="79" r="4" fill="#e2b85c"/>
      <circle cx="64" cy="79" r="4" fill="#79bd8a"/>
      <text x="38" y="124" font-size="14" font-weight="700" fill="#243545">Darren shared a device</text>
      <text x="38" y="153" font-size="13" fill="#435568">Minecraft server PC only</text>
      <rect x="38" y="169" width="131" height="34" rx="8" fill="#d86a63"/>
      <text x="103" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Accept</text>
      <text x="20" y="258" font-size="14" fill="#c8d6e3">Open the private link Darren sends</text>
    </g>
    <g transform="translate(792 16)">
      <rect width="368" height="278" rx="16" fill="#192532" stroke="#344657"/>
      <circle cx="31" cy="31" r="16" fill="#e86c65"/>
      <text x="31" y="37" text-anchor="middle" font-size="17" font-weight="700" fill="#101720">3</text>
      <text x="57" y="38" font-size="20" font-weight="700" fill="#f3f6fa">Join in Minecraft</text>
      <rect x="20" y="65" width="328" height="161" rx="12" fill="#303030" stroke="#858585"/>
      <text x="184" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Edit Server Info</text>
      <text x="40" y="133" font-size="12" fill="#ddd">Server Address</text>
      <rect x="40" y="143" width="288" height="31" fill="#111" stroke="#aaa"/>
      <text x="51" y="163" font-size="12" fill="#eee">private-address:25565</text>
      <rect x="117" y="187" width="134" height="26" fill="#777" stroke="#bbb"/>
      <text x="184" y="205" text-anchor="middle" font-size="13" fill="#fff">Done</text>
      <text x="20" y="258" font-size="14" fill="#c8d6e3">Multiplayer → Add Server</text>
    </g>
  </g>
</svg>
